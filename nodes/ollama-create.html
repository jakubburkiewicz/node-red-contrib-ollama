<script type="text/javascript">
    RED.nodes.registerType( 'ollama-create', {
        category: 'AI',
        color: 'rgb(186 230 253)',
        defaults: {
            name: { value: '' },
            server: { value: '', type: 'ollama-config-server', required: false },
            stream: { value: false, required: false },

            model: { value: '', required: true },
            modelType: { value: "str" },

            from: { value: '',  required: false },
            fromType: { value: "str" },

            quantize: { value: '', required: false },
            quantizeType: { value: "str" },

            template: { value: '', required: false },
            templateType: { value: "str" },

            license: { value: '', required: false },
            licenseType: { value: "str" },

            system: { value: '', required: false },
            systemType: { value: "str" },

            parameters: { value: '[]', required: false },
            parametersType: { value: "json" },

            messages: { value: '', required: false },
            messagesType: { value: "str" },

            adapters: { value: '', required: false },
            adaptersType: { value: "str" }
        },
        inputs: 1,
        outputs: 1,
        icon: 'ollama.png',
        label: function() {
            return this.name || (this.modelType === 'str' && this.model) || 'ollama-create';
        },

        oneditprepare: function() {
            [
                "model",
                "from",
                "quantize",
                "template",
                "license",
                "system",
                "messages",
                "adapters"
            ].forEach( parameter => {
                $( `#node-input-${parameter}` ).typedInput( {
                    types: [ 'str', 'msg', 'flow', 'global' ],
                    typeField: `#node-input-${parameter}Type`
                })
            });

            // not 'str' but 'json'
            [
                "parameters"
            ].forEach( parameter => {
                $( `#node-input-${parameter}` ).typedInput( {
                    types: [ 'json', 'msg', 'flow', 'global' ],
                    typeField: `#node-input-${parameter}Type`
                })
            });
        },

        oneditsave: function() {
        },

        oneditcancel: function() {
        }
    } )
</script>

<script type="text/html" data-template-name="ollama-create">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name" />
    </div>

    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-server"></i> Server</label>
        <input type="text" id="node-input-server" />
    </div>

    <div class="form-row">
        <label for="node-input-model"><i class="fa fa-comment"></i> Model</label>
        <input type="text" id="node-input-model" />
        <input type="hidden" id="node-input-modelType" />
    </div>

    <div class="form-row">
        <label for="node-input-from"><i class="fa fa-file"></i> From</label>
        <input type="text" id="node-input-from" />
        <input type="hidden" id="node-input-fromType" />
    </div>

    <div class="form-row">
        <label for="node-input-stream"><i class="fa fa-umbrella"></i> Stream</label>
        <input type="checkbox" id="node-input-stream" />
    </div>

    <div class="form-row">
        <label for="node-input-quantize"><i class="fa fa-compress"></i> Quantize</label>
        <input type="text" id="node-input-quantize" />
        <input type="hidden" id="node-input-quantizeType" />
    </div>

    <div class="form-row">
        <label for="node-input-template"><i class="fa fa-file-code-o"></i> Template</label>
        <input type="text" id="node-input-template" />
        <input type="hidden" id="node-input-templateType" />
    </div>

    <div class="form-row">
        <label for="node-input-license"><i class="fa fa-certificate"></i> License</label>
        <input type="text" id="node-input-license" />
        <input type="hidden" id="node-input-licenseType" />
    </div>

    <div class="form-row">
        <label for="node-input-system"><i class="fa fa-cog"></i> System</label>
        <input type="text" id="node-input-system" />
        <input type="hidden" id="node-input-systemType" />
    </div>

    <div class="form-row">
        <label for="node-input-parameters"><i class="fa fa-cogs"></i> Parameters</label>
        <input type="text" id="node-input-parameters" />
        <input type="hidden" id="node-input-parametersType" />
    </div>

    <div class="form-row">
        <label for="node-input-messages"><i class="fa fa-comments"></i> Messages</label>
        <input type="text" id="node-input-messages" />
        <input type="hidden" id="node-input-messagesType" />
    </div>

    <div class="form-row">
        <label for="node-input-adapters"><i class="fa fa-plug"></i> Adapters</label>
        <input type="text" id="node-input-adapters" />
        <input type="hidden" id="node-input-adaptersType" />
    </div>
</script>

<script type="text/html" data-help-name="ollama-create">
    <p>Create a model from a <a href="https://github.com/ollama/ollama/blob/main/docs/modelfile.md" target="_blank">Modelfile</a>.</p>

    <h3>Inputs</h3>

    <dl class="message-properties">
        <dt class="optional">
            payload <span class="property-type">object</span>
        </dt>

        <dd>
            The payload object is an alternative way to configure the node.<br />
            Any properties in the payload object will override the node configuration.

            <dl class="message-properties">
                <dt class="optional">
                    payload.host <span class="property-type">string</span>
                </dt>
                <dd>The host of the Ollama instance.</dd>

                <dt class="optional">
                    payload.model <span class="property-type">string</span>
                </dt>
                <dd>The name of the model to create.</dd>

                <dt class="optional">
                    payload.from <span class="property-type">string</span>
                </dt>
                <dd>The base model to derive from.</dd>

                <dt class="optional">
                    payload.stream <span class="property-type">boolean</span>
                </dt>
                <dd>When true an <code>AsyncGenerator</code> is returned.</dd>

                <dt class="optional">
                    payload.quantize <span class="property-type">string</span>
                </dt>
                <dd>Quanization precision level (<code>q8_0</code>, <code>q4_K_M</code>, etc.).</dd>

                <dt class="optional">
                    payload.template <span class="property-type">string</span>
                </dt>
                <dd>The prompt template to use with the model.</dd>

                <dt class="optional">
                    payload.license <span class="property-type">string</span>
                </dt>
                <dd>The license(s) associated with the model.</dd>

                <dt class="optional">
                    payload.system <span class="property-type">string</span>
                </dt>
                <dd>The system prompt for the model.</dd>

                <dt class="optional">
                    payload.parameters <span class="property-type">object</span>
                </dt>
                <dd>Additional model parameters as key-value pairs.</dd>

                <dt class="optional">
                    payload.messages <span class="property-type">array</span>
                </dt>
                <dd>Initial chat messages for the model.</dd>

                <dt class="optional">
                    payload.adapters <span class="property-type">object</span>
                </dt>
                <dd>A key-value map of LoRA adapter configurations.</dd>
            </dl>
        </dd>
    </dl>

    <h3>Outputs</h3>

    <dl class="message-properties">
        <dt>
            payload.status

            <span class="property-type">string</span>
        </dt>
        <dd>The progress status.</dd>
    </dl>
</script>
